version: "3.8"

services:
  android-build:
    image: mingc/android-build-box:latest
    container_name: refraction-build
    volumes:
      - .:/project
      - gradle-cache:/root/.gradle
      - android-sdk-cache:/opt/android-sdk
    working_dir: /project
    # Default to release build; override via: docker-compose run android-build ./gradlew assembleDebug
    command: ["./gradlew", "assembleRelease", "--no-daemon", "--max-workers=2"]
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 8G
        reservations:
          cpus: "1.00"
          memory: 4G
    environment:
      - GRADLE_OPTS=-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dorg.gradle.jvmargs=-Xmx6g
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - JAVA_OPTS=-Xmx6g
    # Ensure container exits after build completes
    init: true

volumes:
  gradle-cache:
  android-sdk-cache:
