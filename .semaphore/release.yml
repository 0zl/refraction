version: v1.0
name: Refraction Release

agent:
  machine:
    type: e1-standard-4
  containers:
    - name: main
      image: mingc/android-build-box:latest

blocks:
  - name: Build Release
    task:
      prologue:
        commands:
          - checkout
          - chmod +x gradlew
          - cache restore gradle-cache
      jobs:
        - name: Assemble Release APK
          commands:
            - ./gradlew assembleRelease --no-daemon --max-workers=2
          env_vars:
            - name: GRADLE_OPTS
              value: "-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
      epilogue:
        on_pass:
          commands:
            - cache store gradle-cache /root/.gradle
        always:
          commands:
            - artifact push job app/build/outputs/apk/release/app-release.apk
